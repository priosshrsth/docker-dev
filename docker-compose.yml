name: docker-dev

# Works on both machines:
#   macOS  -> OrbStack serves the `dev.orbstack.domains` labels (*.orb.local)
#   Linux  -> the `proxy` profile (caddy-docker-proxy) serves the `caddy` labels (*.localhost)
#
# Postgres runs by default. Everything else is opt-in via profiles, e.g.
#   docker compose --profile redis --profile mail up -d
# or set COMPOSE_PROFILES in .env (see .env.example).
#
# Databases (non-HTTP) are reached through their published ports:
#   postgres.localhost:5432, redis.localhost:6379, ... (*.localhost -> loopback)

services:
  # ---------------------------------------------------------------- proxy (Linux)
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.13-alpine
    container_name: caddy
    restart: unless-stopped
    profiles: [proxy]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./volumes/caddy:/data

  # ------------------------------------------------------------------- databases
  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18+ image stores data in a major-version subdir under /var/lib/postgresql
      # (PGDATA=/var/lib/postgresql/18/docker). Mount the parent, not .../data.
      - ./volumes/postgres/data:/var/lib/postgresql
      - ./volumes/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -h localhost"]
      interval: 1m
      timeout: 5s
      retries: 2
      start_period: 30s
      start_interval: 2s
    labels:
      - dev.orbstack.domains=postgres.orb.local

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    profiles: [mysql]
    env_file:
      - path: .env
        required: false
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-app}
      - MYSQL_USER=${MYSQL_USER:-app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 2
      start_period: 60s
      start_interval: 2s
    labels:
      - dev.orbstack.domains=mysql.orb.local

  mysql5:
    image: mysql:5.6
    platform: linux/amd64 # no arm64 build; emulated on Apple Silicon
    container_name: mysql5
    restart: unless-stopped
    profiles: [mysql5]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL5_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL5_PORT:-3305}:3306"
    volumes:
      - ./volumes/mysql5:/var/lib/mysql
    logging:
      driver: "none"
    labels:
      - dev.orbstack.domains=mysql5.orb.local

  redis:
    image: redis:8.8-alpine
    container_name: redis
    restart: unless-stopped
    profiles: [redis]
    command: ["redis-server", "--appendonly", "${REDIS_APPENDONLY:-yes}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m
      timeout: 5s
      retries: 2
      start_period: 30s
      start_interval: 2s
    labels:
      - dev.orbstack.domains=redis.orb.local

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: dragonfly
    restart: unless-stopped
    profiles: [dragonfly]
    ulimits:
      memlock: -1
    ports:
      - "${DRAGONFLY_PORT:-6380}:6379"
    volumes:
      - ./volumes/dragonfly:/data
    labels:
      - dev.orbstack.domains=dragonfly.orb.local

  # -------------------------------------------------------------- HTTP services
  # Local Google Cloud Storage emulator
  gcs:
    image: fsouza/fake-gcs-server:1.56
    container_name: gcs
    restart: unless-stopped
    profiles: [gcs]
    command:
      - -scheme
      - http
      - -backend
      - memory
      - -port
      - "4443"
      # Host used in URLs the emulator hands back (signed/download URLs).
      - -public-host
      - ${GCS_PUBLIC_HOST:-gcs.localhost:4443}
    ports:
      - "${GCS_PORT:-4443}:4443"
    volumes:
      - ./volumes/gcs/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4443/storage/v1/b > /dev/null || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 2
      start_period: 30s
      start_interval: 2s
    labels:
      - dev.orbstack.domains=gcs.orb.local
      - caddy=gcs.localhost
      - caddy.reverse_proxy={{upstreams 4443}}
    logging:
      driver: "none"

  local-smtp:
    image: axllent/mailpit:v1.34
    container_name: local-smtp
    restart: unless-stopped
    profiles: [mail]
    ports:
      - "${SMTP_WEB_PORT:-8326}:8025" # web ui
      - "${SMTP_PORT:-1025}:1025" # smtp
    logging:
      driver: "none"
    labels:
      - dev.orbstack.domains=mail.orb.local
      - caddy=mail.localhost
      - caddy.reverse_proxy={{upstreams 8025}}
